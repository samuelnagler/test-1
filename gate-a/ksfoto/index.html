<style>

body{margin:0;background:var(--sky);color:var(--ink);font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased}
header{min-height:134px;display:flex;align-items:center;justify-content:space-between;padding:0 3.2vw;gap:24px}
.brand{display:flex;align-items:center;gap:18px;color:inherit;text-decoration:none}.brand img{width:135px;height:135px;object-fit:contain}.brand-copy{font-size:22px;line-height:1.38;letter-spacing:.025em}
nav{display:flex;gap:34px;font-size:17px}nav a{color:inherit;text-decoration:none}

.slide{border:0;padding:0;background:#eee;overflow:hidden;cursor:zoom-in;min-width:0;scroll-snap-align:start}.slide img{width:100%;height:100%;display:block;object-fit:cover}.slide:nth-child(1){grid-column:1;grid-row:1/span 2}.slide:nth-child(2){grid-column:2;grid-row:1}.slide:nth-child(3){grid-column:3;grid-row:1}.slide:nth-child(4){grid-column:2/span 2;grid-row:2}.slide:nth-child(5){grid-column:4;grid-row:1/span 2}.slide:nth-child(6){grid-column:5;grid-row:1/span 2}.slide:nth-child(7){grid-column:6;grid-row:1/span 2}.slide:nth-child(8){grid-column:7;grid-row:1/span 2}
.arrow{position:absolute;z-index:3;top:50%;transform:translateY(-50%);width:46px;height:46px;border:0;border-radius:50%;background:rgba(255,255,255,.86);font-size:34px;box-shadow:0 3px 16px rgba(0,0,0,.12)}.prev{left:12px}.next{right:12px}.counter{position:absolute;right:22px;bottom:18px;background:rgba(0,0,0,.66);color:#fff;padding:6px 10px;border-radius:16px;font-size:12px}
.about,.imprint{background:var(--warm);padding:70px max(7vw,40px)}.about-grid{max-width:1280px;margin:auto;display:grid;grid-template-columns:1fr 1.18fr;gap:60px;align-items:center}.about img{width:100%;max-height:680px;object-fit:cover}.about h2,.imprint h2{font-size:56px;font-weight:300;line-height:1.12;margin:0 0 24px}.about p,.imprint p{font-size:16px;line-height:1.68;white-space:pre-line;margin:0}.imprint .inner{max-width:1080px;margin:auto}
footer{min-height:170px;display:flex;align-items:center;justify-content:center;font-size:14px}
.preview-badge{position:fixed;z-index:50;top:10px;left:10px;background:rgba(0,0,0,.72);color:#fff;padding:6px 9px;border-radius:14px;font-size:10px;letter-spacing:.04em}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:100;display:none;align-items:center;justify-content:center;padding:18px}.lightbox.open{display:flex}.lightbox img{max-width:100%;max-height:92vh;object-fit:contain}.close{position:absolute;top:max(16px,env(safe-area-inset-top));right:16px;width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.16);color:white;font-size:30px}
@media(max-width:760px){
header{min-height:108px;padding:12px 16px}.brand{gap:10px}.brand img{width:72px;height:72px}.brand-copy{font-size:15px}.nav{font-size:13px;gap:12px;align-self:flex-start;padding-top:14px;flex-wrap:wrap;justify-content:flex-end;max-width:170px}
.portfolio{padding:22px 0 34px;margin-bottom:26px}.head{padding:0 18px 18px}.head h2{font-size:46px;line-height:1.1;margin-bottom:14px}.head p{font-size:15px;line-height:1.42}
.rail{display:flex;gap:12px;padding:0 16px 16px;scroll-snap-type:x mandatory}.slide,.slide:nth-child(n){flex:0 0 calc(100vw - 42px);height:min(68vh,560px);grid-column:auto;grid-row:auto;scroll-snap-align:center}.slide img{object-fit:contain;background:#efefef}.arrow{display:none}.counter{right:24px;bottom:26px}
.about,.imprint{padding:48px 20px}.about-grid{grid-template-columns:1fr;gap:30px}.about h2,.imprint h2{font-size:44px}.about p,.imprint p{font-size:15px}.preview-badge{display:none}
}

<script>
const sections=[["Hochzeit","Habt ihr Lust eure Liebesgeschichte für immer festzuhalten? Dann lasst uns euren besonderen Tag unvergesslich machen.",["5f5337_fc1c40267bff4ad5b3fe7bb11a0ed176~mv2.jpg","5f5337_17fc6aa471ba429a84faaef9d1340ae7~mv2.jpg","5f5337_5fa6cf34ef3f4c22aa460eb840e8f936~mv2.jpg","5f5337_b228dfa9dd204568b803f941d130a114~mv2.jpg","5f5337_eee68e9c06a6461fbbba8b4be980d2d0~mv2.jpg","5f5337_7b5395a6fb9d462388325c52e320fec5~mv2.jpg","5f5337_4b81c00a277346bb91c87a455c9c7bec~mv2.jpg","5f5337_4967907f0f6d41358e35153fd20828d7~mv2.jpg"]],["Babybauch","Entdecke die Schönheit der Schwangerschaft mit einem Babybauchshooting. Wir fangen die unbeschreiblichen Emotionen und die Vorfreude gemeinsam ein.",["5f5337_f9d4bb83a75043868ca5bd650e106b47~mv2.jpg","5f5337_6b3d02c2acf041acbedb6ef83f37d641~mv2.jpg","5f5337_35314931d4f34195ab2c4ee0ca424ef7~mv2.jpg","5f5337_e7ec799a30f945a7a61af2523560de76~mv2.jpg","5f5337_f476e9bba5b34c1e8a71979acbcb42d4~mv2.jpg","5f5337_0e8b0c16114d4b1ab3aa7f8702c5e2a8~mv2.jpg","5f5337_9d2e3989adc046dea1248ac1bc78bbce~mv2.jpg","5f5337_b230e544c8ca4388bb6ffaf4864a60fb~mv2.jpg"]],["Familie","Gemeinsam schaffen wir Erinnerungen durch Fotos, die eure Familiengeschichte festhält.",["5f5337_1f0aef168bdd4a01baa0a055b16ae6f5~mv2.jpg","5f5337_625f5f34d63746eb99db6516ca985f66~mv2.jpg","5f5337_937b6079283d4bc7be95a693c2f7a3ff~mv2.jpg","5f5337_eb05395c48294af8957e199f0d1e146a~mv2.jpg","5f5337_b10c3ab37c804a88882105d7b0c6f78a~mv2.jpg","5f5337_6a1f32c300d9410c8441e6e1a1bac8de~mv2.jpg","5f5337_238b141309fe4c778be49607881c3d64~mv2.jpg","5f5337_decf7d2f79c9429f9b979fbf7e183489~mv2.jpg"]],["Portraits","Gemeinsam halten wir deine individuelle Schönheit auf authentische Weise fest.",["5f5337_b4e92538b4c2461d8270cca996ca4a50~mv2.jpg","5f5337_f0dc977070cc43da94d05b268583552c~mv2.jpg","5f5337_4bd5c98ec86b46a4b093539d6143a465~mv2.jpg","5f5337_a0e6c5545cf8451789f621ec399b8e13~mv2.jpg","5f5337_28ea5e3d3cab47bcb6b8a4e2fe4e75a4~mv2.jpg","5f5337_15ef779add974b989c5fa09ad77cfe33~mv2.jpg","5f5337_fbab2de237e243ddae593e681cf0597b~mv2.jpg","5f5337_8632c20869264003960c1e7b98b35cc7~mv2.jpg"]],["Pärchen","Wir schaffen Erinnerungen, die eure einzigartige Liebe in vielen Bildern festhält.",["5f5337_d81aa7f6fe064e71bc12f3d66bb4495a~mv2.jpg","5f5337_423117b1f93f44fb89283195080b2a33~mv2.jpg","5f5337_337a64eb01944c1783e56eff3800cfe5~mv2.jpg","5f5337_0a839743a9ab4faca437c04563d48458~mv2.jpg","5f5337_a291838b175b4f23807a2b72b85fc632~mv2.jpg","5f5337_7738e078e1ef401cafbb5b932c77d6e9~mv2.jpg","5f5337_c0de504ee3c54fcba84fd1bba6870093~mv2.jpg","5f5337_bf3aa1e425094e4d86e8529c38248a20~mv2.jpg"]],["Business","Du baust dir gerade ein Business auf und brauchst Bilder für Social Media oder deine Website? Wir schaffen gemeinsam deine Bilder, ganz individuell.",["5f5337_752a61493bba4971a34d27c3ec3a38fc~mv2.jpg","5f5337_1cf318d907df43358bbc73962ebf8d60~mv2.jpg","5f5337_1f7e6efd0a334a108203fe0430e75fc3~mv2.jpg","5f5337_093b57b878804e87b808685ce9becad7~mv2.jpg","5f5337_1ab5c7029daa4cca8aacfa53397ec312~mv2.jpg","5f5337_4dcd9232698f4c42bfb58dcb7d0094d6~mv2.jpg","5f5337_3f9572876a5f429eb0429272d3d1e040~mv2.jpg","5f5337_523515f76bc34c5aa2c55315bdc51ba1~mv2.jpg"]],["Eure Vierbeiner","Es heißt, Vierbeiner sind die besten Freunde des Menschen und jede Aufnahme erzählt eine eigene Geschichte. Ich freue mich, die Momente mit deinen Fellfreunden mit viel Geduld in Bildern festzuhalten.",["5f5337_5b68c6d3b3474ebeb6a2deb97cbf815b~mv2.jpg","5f5337_7ea27b5e0dc942709ad945d6c5b32ef3~mv2.jpg","5f5337_9f06a814f4e6493e9fbcfb78f5340080~mv2.jpg","5f5337_1a8f14f7198b46eb920b23e5fba125d7~mv2.jpg","5f5337_5176934c08c745e9adb1073530f8911d~mv2.jpg","5f5337_84d16019b79c45699b9b0ea7c312c01a~mv2.jpg","5f5337_5f82b53a61264cb4bd6745425149d99b~mv2.jpg","5f5337_78f069ab09914c8c9c63ed385fff681d~mv2.jpg"]],["Feedback meiner Kunden","",["5f5337_9bedd9c491db43a296f3e4ca70e6f16b~mv2.png","5f5337_d5ed44b3d07444599f6f5204f4c30343~mv2.png","5f5337_88b701c9a6a84d15a525d6e47a20d206~mv2.png","5f5337_6dd6572fa8c24d86906187ba180f3a85~mv2.jpg","5f5337_895b9ecab8444f78a97445cb0bb17d3d~mv2.jpeg","5f5337_5284f4452b614adaa274c4aab6135c3c~mv2.jpg","5f5337_60fee983f21a437e93651c80782bd1f5~mv2.jpg","5f5337_21371c2b2b454477a2972e28e8e3f317~mv2.jpeg"]]], about="Die Faszination für die Fotografie begleitet mich seit meiner Jugend, als mein Opa mir im Teenageralter meine erste Kamera schenkte. Seitdem sind wir unzertrennlich - die Kamera und ich. Das Festhalten von schönen Momenten wurde zu meiner Leidenschaft, und ich liebe es, mich an jeden einzelnen dieser Augenblicke zu erinnern.\n\nGenau diese Leidenschaft und Liebe zum Detail bringe ich in meine Arbeit ein. Gemeinsam schaffen wir Erinnerungen, die auch nach Jahren noch einen bleibenden Eindruck hinterlassen werden. Egal, ob es sich um intime Babybauchshootings, emotionale Familienshootings, den großen Tag eurer Hochzeit oder das Festhalten eurer pelzigen Familienmitglieder handelt – ich bin für euch da.\n\nMein Herz schlägt nicht nur für die Fotografie selbst, sondern auch für die Verbindung, die ich zu meinen Kunden aufbaue. Als eure Vertraute bin ich mit Herzblut dabei und sorge dafür, dass eure schönsten Momente authentisch und liebevoll festgehalten werden.\n\nOb im Freien, wo ich besonders gerne unterwegs bin und die Natur als Kulisse nutze, oder in meinem Studio, das perfekte Setting für besondere Portraits bietet – ich passe mich euren Wünschen an. Meine Bilder folgen keinem kurzlebigen Trend; sie sind vielmehr authentisch, natürlich und zeitlos.\n\nIch freue mich darauf, mit euch zusammen unvergessliche Erinnerungen zu schaffen und eure Geschichten in Bildern zu erzählen.";
const media="https://static.wixstatic.com/media/";
const img=(name,w=900,h=1350)=>media+name+"/v1/fit/w_"+w+",h_"+h+",q_85/"+name;
const app=document.getElementById("app");
sections.forEach(([title,desc,imgs])=>{
 const s=document.createElement("section");s.className="portfolio";
 s.innerHTML='<div class="head"><h2>'+title+'</h2>'+(desc?'<p>'+desc+'</p>':'')+'</div><div class="wrap"><button class="arrow prev">‹</button><div class="rail"></div><button class="arrow next">›</button><div class="counter"><span>1</span> / '+imgs.length+'</div></div>';
 const rail=s.querySelector(".rail"),counter=s.querySelector(".counter span");
 imgs.forEach((name,i)=>{const b=document.createElement("button");b.className="slide";b.type="button";b.dataset.hi=img(name,1600,2400);b.innerHTML='<img src="'+img(name)+'" alt="" '+(i?"loading='lazy'":"fetchpriority='high'")+">";rail.appendChild(b)});
 const update=()=>{const c=rail.scrollLeft+rail.clientWidth/2;let best=0,d=1e9;[...rail.children].forEach((x,i)=>{const q=Math.abs(x.offsetLeft+x.offsetWidth/2-c);if(q<d){d=q;best=i}});counter.textContent=best+1};
 rail.addEventListener("scroll",()=>requestAnimationFrame(update),{passive:true});s.querySelector(".next").onclick=()=>rail.scrollBy({left:Math.max(rail.clientWidth*.72,360),behavior:"smooth"});s.querySelector(".prev").onclick=()=>rail.scrollBy({left:-Math.max(rail.clientWidth*.72,360),behavior:"smooth"});app.appendChild(s);
});
document.getElementById("aboutText").textContent=about;
const lb=document.getElementById("lb"),lbImg=lb.querySelector("img");
document.addEventListener("click",e=>{const b=e.target.closest(".slide");if(b){lbImg.src=b.dataset.hi;lb.classList.add("open");document.body.style.overflow="hidden"}});
function close(){lb.classList.remove("open");lbImg.removeAttribute("src");document.body.style.overflow=""}
lb.querySelector(".close").onclick=close;lb.onclick=e=>{if(e.target===lb)close()};document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
</script>
