name: Sync German artwork data
on:
  push:
    paths:
      - '.github/workflows/sync-german-products.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync German market prices and localized descriptions
        run: |
          python3 - <<'PY'
          import json, re, html, urllib.request
          from pathlib import Path

          pth=Path("assets/products.json")
          data=json.loads(pth.read_text(encoding="utf-8"))
          headers={"User-Agent":"Mozilla/5.0"}

          def get_json(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=60) as r:
                  return json.loads(r.read().decode("utf-8"))

          def clean(s):
              s=re.sub(r'<br\s*/?>','\n',s,flags=re.I)
              s=re.sub(r'</p\s*>','\n',s,flags=re.I)
              s=re.sub(r'<[^>]+>','',s)
              s=html.unescape(s)
              return '\n'.join(line.strip() for line in s.splitlines() if line.strip())

          for p in data["products"]:
              h=p["handle"]
              en=get_json(f"https://samuelnagler.com/products/{h}.js?country=DE")
              de=get_json(f"https://samuelnagler.com/de/products/{h}.js?country=DE")
              p["price"]=int(en.get("price",p.get("price",0)))
              p["available"]=bool(en.get("available",p.get("available",False)))
              p["description"]=clean(en.get("description",""))
              p["descriptionDe"]=clean(de.get("description",""))
          pth.write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding="utf-8")
          PY
      - name: Commit localized data
        run: |
          git config user.name "Samuel site sync"
          git config user.email "actions@users.noreply.github.com"
          git add assets/products.json
          git commit -m "Sync German market prices and descriptions" || exit 0
          git push
