name: Mirror Shopify assets
on:
  push:
    paths:
      - '.github/workflows/mirror-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror artwork and site images
        run: |
          python3 - <<'PY'
          import os, json, re, html, urllib.request, urllib.parse
          from pathlib import Path

          ROOT = Path('.')
          handles = ["royalty","majesty","cherry","blossom","rise","dawn","heat","frost","electron","proton","nil","animals","ancestors","confrontation","landing","clouds","diamantus","dissonance","sunset","beginning","aurum","argentum","aereus","lapis","aqua","planta","aeris","oceanus","florere","ignis","potsda","spri","valenti","strawb","sea","deep-sea","midas","moon","sun","sapphire"]
          ua={"User-Agent":"Mozilla/5.0"}

          def get(url):
              req=urllib.request.Request(url,headers=ua)
              with urllib.request.urlopen(req,timeout=60) as r:
                  return r.read(), r.headers.get_content_type()

          def clean_text(s):
              s=re.sub(r'<br\s*/?>','\n',s,flags=re.I)
              s=re.sub(r'</p\s*>','\n',s,flags=re.I)
              s=re.sub(r'<[^>]+>','',s)
              return html.unescape(s).strip()

          def dl(url,path):
              path.parent.mkdir(parents=True,exist_ok=True)
              data,_=get(url)
              path.write_bytes(data)

          products=[]
          for h in handles:
              raw,_=get(f'https://samuelnagler.com/products/{h}.js')
              p=json.loads(raw.decode('utf-8'))
              local=[]
              for i,u in enumerate(p.get('images',[]),1):
                  if u.startswith('//'): u='https:'+u
                  ext=os.path.splitext(urllib.parse.urlparse(u).path)[1].lower() or '.jpg'
                  if ext not in ['.jpg','.jpeg','.png','.webp']: ext='.jpg'
                  out=ROOT/'assets'/'artworks'/h/f'{i}{ext}'
                  dl(u,out)
                  local.append('/'+str(out).replace(os.sep,'/'))
              products.append({
                  'title':p.get('title',h),
                  'handle':h,
                  'description':clean_text(p.get('description','')),
                  'available':bool(p.get('available')),
                  'price':p.get('price'),
                  'images':local
              })

          site={
            'logo':'https://cdn.shopify.com/s/files/1/0917/5623/3034/files/IMG_7987.jpg?v=1742329208',
            'hero':'https://cdn.shopify.com/s/files/1/0917/5623/3034/files/IMG_8348_4b6f36ba-a78f-4a6f-8d71-710bb5b14c9c.jpg?v=1774089562',
            'art1':'https://cdn.shopify.com/s/files/1/0917/5623/3034/files/IMG_9203_dd524e9e-1308-46d5-b8b3-58852fbe20f6.jpg?v=1742422136',
            'art2':'https://cdn.shopify.com/s/files/1/0917/5623/3034/files/IMG_9206.jpg?v=1742422117',
            'art3':'https://cdn.shopify.com/s/files/1/0917/5623/3034/files/IMG_9393.jpg?v=1742938472',
            'career1':'https://cdn.shopify.com/s/files/1/0917/5623/3034/files/IMG_9166.jpg?v=1742416877',
            'career2':'https://cdn.shopify.com/s/files/1/0917/5623/3034/files/IMG_9249.jpg?v=1742429125'
          }
          local_site={}
          for name,u in site.items():
              ext=os.path.splitext(urllib.parse.urlparse(u).path)[1].lower() or '.jpg'
              out=ROOT/'assets'/'site'/f'{name}{ext}'
              dl(u,out)
              local_site[name]='/'+str(out).replace(os.sep,'/')

          (ROOT/'assets').mkdir(exist_ok=True)
          (ROOT/'assets'/'products.json').write_text(json.dumps({'products':products,'site':local_site},ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Commit mirrored assets
        run: |
          git config user.name "Samuel site mirror"
          git config user.email "actions@users.noreply.github.com"
          git add assets
          git commit -m "Mirror Shopify artwork assets" || exit 0
          git push
